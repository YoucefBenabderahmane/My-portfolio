<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You | Youcef's Portfolio</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
  <style>
    body {
      background: #0f0f0f;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .thank-you-box {
      background: linear-gradient(120deg, rgba(0,255,150,0.1), rgba(0,255,150,0.03));
      padding: 40px;
      border-radius: 15px;
      border: 1px solid #00ff96;
      max-width: 500px;
    }

    .thank-you-box h1 {
      color: #00ff96;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .thank-you-box p {
      font-size: 16px;
      line-height: 1.5;
      color: #ccc;
    }

    .back-link {
      margin-top: 30px;
      display: inline-block;
      color: #00ff96;
      text-decoration: none;
      border: 1px solid #00ff96;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .back-link:hover {
      background-color: #00ff96;
      color: #0f0f0f;
    }
  </style>
</head>
<body>

  <div class="thank-you-box">
    <h1>🎉 Thank You!</h1>
    <p>Your message has been successfully sent.<br>
    I'll get back to you as soon as possible.</p>

    <a class="back-link" href="index.html">← Back to Home</a>
  </div>

</body>
</html>
